services:
  postgres-test:
    image: postgres:16-alpine
    container_name: rloc-async-postgres-test
    environment:
      POSTGRES_DB: ${RLOC_TEST_DB_NAME:-rloc_async_test}
      POSTGRES_USER: ${RLOC_TEST_DB_USER:-rloc_test}
      POSTGRES_PASSWORD: ${RLOC_TEST_DB_PASSWORD:-rloc_test_password}
    ports:
      - "127.0.0.1:${RLOC_TEST_DB_PORT:-55432}:5432"
    volumes:
      - rloc_async_test_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RLOC_TEST_DB_USER:-rloc_test} -d ${RLOC_TEST_DB_NAME:-rloc_async_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rloc-test

volumes:
  rloc_async_test_data:

networks:
  rloc-test:
    driver: bridge
